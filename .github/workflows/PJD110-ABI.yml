    - name: Compile scheduler ABI assertions and vendor hook objects
      if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
      id: fast_build
      run: "cd kernel_workspace/kernel_platform\n\n# 自动检测 LLVM_IAS\nif [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm;\
        \ then\n  USE_LLVM_IAS=true\nelse\n  USE_LLVM_IAS=false\nfi\n\n# 强制递推路径\nCLANG_PREBUILT_NAME=$(find \"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform\"\
        \ -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/clang/host/linux-x86' \\; -print | head -1)\nCLANG_PREBUILT_NAME=$(basename\
        \ \"${CLANG_PREBUILT_NAME:-}\")\necho \"✅ CLANG_PREBUILT_NAME=$CLANG_PREBUILT_NAME\"\n\nKERNEL_BUILD_TOOLS_PREBUILT_NAME=$(find \"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform\"\
        \ -maxdepth 1 -type d -name 'prebuilts*' -exec test -d '{}/kernel-build-tools' \\; -print | head -1)\nKERNEL_BUILD_TOOLS_PREBUILT_NAME=$(basename\
        \ \"${KERNEL_BUILD_TOOLS_PREBUILT_NAME:-}\")\necho \"✅ KERNEL_BUILD_TOOLS_PREBUILT_NAME=$KERNEL_BUILD_TOOLS_PREBUILT_NAME\"\n\nif [[ \"\
        $ENABLE_RUST\" == \"true\" ]]; then\n  RUST_TOOLS_PREBUILT_NAME=$(find \"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform\" -maxdepth\
        \ 1 -type d -name 'prebuilts*' -exec test -d '{}/rust' \\; -print | head -1)\n  RUST_TOOLS_PREBUILT_NAME=$(basename \"${RUST_TOOLS_PREBUILT_NAME:-}\"\
        )\n  echo \"✅ RUST_TOOLS_PREBUILT_NAME=$RUST_TOOLS_PREBUILT_NAME\"\nfi\n\n# 从 build.config.common 读取 CLANG_PREBUILT_BIN，或者用递推路径 fallback\n\
        CLANG_PREBUILT_BIN=\"\"\nif [[ -f ./common/build.config.common ]]; then\n  CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./common/build.config.common\
        \ | cut -d'=' -f2-)\nfi\n\nif [[ -z \"$CLANG_PREBUILT_BIN\" ]]; then\n  CLANG_PREBUILT_BIN=\"${CLANG_PREBUILT_NAME}/clang/host/linux-x86/clang-zakozako/bin\"\
        \nfi\n\n# 优先尝试从 CLANG_PREBUILT_BIN 识别出 clang-r，再去掉 clang-，作为 CLANG_VERSION\nif [[ \"$CLANG_PREBUILT_BIN\" =~ clang-(r[0-9a-z]+) ]]; then\n\
        \  CLANG_VERSION=\"${BASH_REMATCH[1]}\"\nelse\n  # 如果未匹配到，尝试从 build.config.constants 提取\n  if [[ -f ./common/build.config.constants ]];\
        \ then\n    CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)\n  fi\nfi\n\nif [[ -z \"$CLANG_VERSION\"\
        \ ]]; then\n  echo \"⚠️ 未能从 CLANG_PREBUILT_BIN 或 build.config.constants 获取到 Clang 版本，回退至官方构建脚本\"\n  echo \"fallback=true\" >> \"$GITHUB_OUTPUT\"\
        \n  echo \"请考虑关闭 FAST_BUILD 并提交问题\"\n  exit 0\nfi\n\nCLANG_PREBUILT_BIN=\"${CLANG_PREBUILT_BIN/\\$\\{CLANG_VERSION\\}/$CLANG_VERSION}\"\
        \nCLANG_PREBUILT_BIN=\"${CLANG_PREBUILT_BIN/clang-zakozako/clang-${CLANG_VERSION}}\"\n\necho \"✅ CLANG_PREBUILT_BIN=$CLANG_PREBUILT_BIN\"\
        \necho \"✅ CLANG_VERSION=$CLANG_VERSION\"\necho \"✅ USE_LLVM_IAS=$USE_LLVM_IAS\"\n\nset +u\nsource \"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/kernel/_setup_env.sh\"\
        \ 2>/dev/null || true\nset -u\n\nexport PATH=\"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH\"\nCLANG_LIB_PATH=\"\
        ${CLANG_PREBUILT_BIN%/bin}\"\nif [[ -d \"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib\" ]]; then\n  export LIBCLANG_PATH=\"\
        $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_LIB_PATH/lib\"\nelif [[ -d \"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib\"\
        \ ]]; then\n  export LIBCLANG_PATH=\"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/clang-${CLANG_VERSION}/lib\"\nelse\n  export LIBCLANG_PATH=\"\
        $(clang --print-resource-dir 2>/dev/null | sed 's|/lib/clang/.*||')/lib\" \n  echo \"⚠️ LIBCLANG_PATH fallback to system: $LIBCLANG_PATH\"\
        \nfi\necho \"✅ LIBCLANG_PATH=$LIBCLANG_PATH\"\nexport PATH=\"/usr/lib/ccache:$PATH\"\n\n# BINDGEN 检测与 fallback\nif [[ \"$ENABLE_RUST\"\
        \ == \"true\" ]]; then\n  BINDGEN_BIN=\"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_NAME/clang-tools/linux-x86/bin/bindgen\"\
        \n  if [ -x \"$BINDGEN_BIN\" ]; then\n    export BINDGEN=\"$BINDGEN_BIN\"\n    echo \"✅ bindgen exists: $BINDGEN_BIN\"\n  else\n    echo\
        \ \"⚠️ prebuilts bindgen 未找到，fallback 到 cargo 安装 bindgen 0.69.5\"\n    echo \"::group::Install bindgen via cargo\"\n    curl --proto '=https'\
        \ --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none\n    source \"$HOME/.cargo/env\"\n    cargo install bindgen-cli\
        \ --version 0.69.5\n    echo \"::endgroup::\"\n    BINDGEN_BIN=$(which bindgen)\n    export BINDGEN=\"$BINDGEN_BIN\"\n    echo \"✅ BINDGEN_BIN\
        \ (cargo): $BINDGEN_BIN\"\n  fi\nfi\n\n# PAHOLE 检测与 fallback\nPAHOLE_BIN=\"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$KERNEL_BUILD_TOOLS_PREBUILT_NAME/kernel-build-tools/linux-x86/bin/pahole\"\
        \nif [ ! -x \"$PAHOLE_BIN\" ]; then\n  PAHOLE_BIN=\"$(which pahole 2>/dev/null)\"\n  [ -x \"$PAHOLE_BIN\" ] && echo \"⚠️ pahole fallback\
        \ to PATH: $PAHOLE_BIN\"\nfi\nif [ -x \"$PAHOLE_BIN\" ]; then\n  echo \"✅ pahole exists: $PAHOLE_BIN\"\nelse\n  echo \"❌ pahole 完全缺失，终止构建\"\
        \n  exit 13\nfi\n\n# RUSTC 检测与 fallback\nif [[ \"$ENABLE_RUST\" == \"true\" ]]; then\n  RUSTC_BIN=\"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$RUST_TOOLS_PREBUILT_NAME/rust/linux-x86/$RUSTC_DIR_VERSION/bin/rustc\"\
        \n  if [ ! -x \"$RUSTC_BIN\" ]; then\n    RUSTC_BIN=\"$(which rustc 2>/dev/null)\"\n    [ -x \"$RUSTC_BIN\" ] && echo \"⚠️ rustc fallback\
        \ to PATH: $RUSTC_BIN\"\n  fi\n  if [ -x \"$RUSTC_BIN\" ]; then\n    echo \"✅ rustc exists: $RUSTC_BIN\"\n    export RUSTC=\"$RUSTC_BIN\"\
        \n  else\n    echo \"❌ rustc 完全缺失且 ENABLE_RUST=true，终止构建\"\n    exit 13\n  fi\nfi\n\nLD_WRAPPER=\"\"\nif [ \"${{ github.event.inputs.BUILD_NOCACHE\
        \ }}\" = \"false\" ] && [[ \"$KERNEL_VERSION\" == 5.* ]]; then\n  LDCACHE_DIR=\"${GITHUB_WORKSPACE}/kernel_workspace/.thinlto-cache\"\n\
        \  mkdir -p \"$LDCACHE_DIR\"\n  LD_WRAPPER=\"${GITHUB_WORKSPACE}/kernel_workspace/ld-wrapper\"\n  LLD_BIN=\"$(command -v ld.lld)\"\n \
        \ if [[ -z \"$LLD_BIN\" ]]; then\n    echo \"⚠️ ld.lld 未找到，无法创建 ld-wrapper\"\n  fi\n  printf '#!/bin/bash\\nexec \"%s\" \"$@\" --thinlto-cache-dir=\"\
        %s\" --thinlto-cache-policy=cache_size_bytes=3g --thinlto-jobs=%s\\n' \"$LLD_BIN\" \"$LDCACHE_DIR\" \"$(nproc --all)\" > \"$LD_WRAPPER\"\
        \n  chmod +x \"$LD_WRAPPER\"\n  echo \"✅ ld-wrapper 已创建: $LD_WRAPPER (lld=$LLD_BIN, cache=$LDCACHE_DIR)\"\nfi\n\nREAL_CLANG_BIN=\"$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN/clang\"\
        \nCC_WRAPPER=\"$GITHUB_WORKSPACE/kernel_workspace/cc-wrapper\"\nprintf '#!/bin/bash\\nexec ccache \"%s\" \"$@\"\\n' \"$REAL_CLANG_BIN\"\
        \ > \"$CC_WRAPPER\"\nchmod +x \"$CC_WRAPPER\"\necho \"✅ cc-wrapper 已创建: $CC_WRAPPER (clang=$REAL_CLANG_BIN)\"\n\ncd ./common\n\n# 重映射物理路径\n\
        COMMON_REAL_PATH=$(pwd -P)\nPLATFORM_REAL_PATH=$(dirname \"$COMMON_REAL_PATH\")\nROOT_REAL_PATH=$(dirname \"$PLATFORM_REAL_PATH\")\nMAP=\"\
        -fdebug-prefix-map=$ROOT_REAL_PATH=.\"\nMPMAP=\"-fmacro-prefix-map=$ROOT_REAL_PATH=.\"\nFPMAP=\"-ffile-prefix-map=$ROOT_REAL_PATH=.\"\n\
        \n# KCFLAGS\nKCFLAGS=\"$MAP $FPMAP -no-canonical-prefixes -O2 -pipe -Wno-error -fno-stack-protector -D__ANDROID_COMMON_KERNEL__\"\nKCPPFLAGS=\"\
        $MPMAP\"\n\nMAKE_ARGS=(\n  LLVM=1\n  ARCH=arm64\n  CROSS_COMPILE=aarch64-linux-gnu-\n  CC=\"$CC_WRAPPER\"\n  HOSTCC=\"$CC_WRAPPER\"\n\
        \  HOSTLD=ld.lld\n  PAHOLE=\"$PAHOLE_BIN\"\n  KCFLAGS=\"$KCFLAGS -D__ANDROID_COMMON_KERNEL__\"\n  KCPPFLAGS=\"$KCPPFLAGS\"\n)\n\nif [[\
        \ -n \"${CONFIG_FAKE_DISABLE:-}\" ]]; then\n  MAKE_ARGS+=(CONFIG_FAKE_DISABLE=\"$CONFIG_FAKE_DISABLE\")\nfi\nif [[ -n \"$LD_WRAPPER\"\
        \ ]]; then\n  MAKE_ARGS+=(LD=\"$LD_WRAPPER\")\nelse\n  MAKE_ARGS+=(LD=ld.lld)     \nfi\nif [[ \"$USE_LLVM_IAS\" == \"true\" ]]; then\n\
        \  MAKE_ARGS+=(LLVM_IAS=1)\nfi\nif [[ \"$ENABLE_RUST\" == \"true\" ]]; then\n  MAKE_ARGS+=(RUSTC=\"$RUSTC_BIN\")\n  MAKE_ARGS+=(BINDGEN=\"\
        $BINDGEN_BIN\")\nfi\n\nmake O=out \"${MAKE_ARGS[@]}\" gki_defconfig --no-print-directory\n\nif [[ \"$KERNEL_VERSION\" == 5.* ]]; then\n\
        \  echo \"# 设置 LTO = thin\"\n  scripts/config --file out/.config -e LTO_CLANG\n  scripts/config --file out/.config -e LTO_CLANG_THIN\n\
        \  scripts/config --file out/.config -d LTO_CLANG_NONE\n  scripts/config --file out/.config -d LTO_CLANG_FULL\nfi\n\nmake O=out \"${MAKE_ARGS[@]}\"\
        \ olddefconfig --no-print-directory\ngrep -q '^CONFIG_SLIM_SCHED=y$' out/.config\nmake -j\"$(nproc --all)\" O=out \"${MAKE_ARGS[@]}\"\
        \ kernel/sched/ drivers/android/vendor_hooks.o 2>&1 | tee \"$GITHUB_WORKSPACE/scheduler-abi-compile.log\"\nprintf '%s\\n' 'Scheduler C\
        \ compilation and measured layout assertions passed. HMBIRD interface implementation remains incomplete; this artifact is not flashable.'\
        \ > \"$GITHUB_WORKSPACE/ABI-DIAGNOSTIC-NOT-FLASHABLE.txt\"\n"
    - name: Upload ABI diagnostic evidence only
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: PJD110-scheduler-ABI-diagnostic-NOT-FLASHABLE
        include-hidden-files: true
        path: 'resolved-manifest.xml

          scheduler-abi-compile.log

          ABI-DIAGNOSTIC-NOT-FLASHABLE.txt

          pjd110-stock-scheduler-abi.wip.patch

          kernel_workspace/kernel_platform/common/out/.config

          kernel_workspace/kernel_platform/common/out/kernel/sched/*.o

          kernel_workspace/kernel_platform/common/out/drivers/android/vendor_hooks.o'
    timeout-minutes: 90
