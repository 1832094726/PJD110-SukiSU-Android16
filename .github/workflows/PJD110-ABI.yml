name: PJD110 scheduler ABI diagnostic - NOT FLASHABLE
jobs:
  build:
    name: PJD110 scheduler ABI diagnostic
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: none
      CCACHE_NOHASHDIR: 'true'
      CCACHE_NOHARDLINK: 'true'
      CCACHE_IS_KERNEL_COMPILING: 'true'
      CCACHE_MAXSIZE: 5G
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Maximize Build Space
      if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
      env:
        ROOT_RESERVE_MB: '8192'
        TEMP_RESERVE_MB: '2048'
        REMOVE_DOTNET: 'true'
        REMOVE_ANDROID: 'true'
        REMOVE_HASKELL: 'true'
        REMOVE_CODEQL: 'true'
      run: bash scripts/maximize-build-space.sh
    - name: Configure Git
      run: 'git config --global user.name "Numbersf"

        git config --global user.email "263623064@qq.com"

        mkdir kernel_workspace && cd kernel_workspace

        git clone https://github.com/Numbersf/Action-Build.git -b SukiSU-Ultra

        '
    - name: Extract Manifest Info
      id: extract_info
      env:
        FILE: ${{ github.event.inputs.FILE }}
      run: "set -e\ncd \"$GITHUB_WORKSPACE\"\nif [[ \"$FILE\" =~ ^(.+)_([a-zA-Z])$ ]]; then\n  FILE_CONF=\"${BASH_REMATCH[1]}\"\nelse\n  FILE_CONF=\"\
        $FILE\"\nfi\nFILE_BASE=$(echo \"$FILE_CONF\" | sed -E 's/_bak//g; /_aosp/{s/_aosp//g;s/$/(AOSP)/;}; s/_([a-zA-Z0-9])/\\U\\1/g; s/^oneplus/OnePlus/;\
        \ s/^realme/RealME/; s/^oppo/OPPO/')\nmkdir -p \".repo/manifests_fallback\"\nXML_PATH=\".repo/manifests_fallback/${FILE}.xml\"\nREADME_PATH=\"\
        .repo/manifests_fallback/README.md\"\necho \"处理 FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE\"\necho \"FILE_CONF=$FILE_CONF\" >> $GITHUB_ENV\n\
        echo \"FILE_BASE=$FILE_BASE\" >> $GITHUB_ENV\n\n# 动态调用源码清单仓库，仓库优先级：1️⃣ OnePlusOSS → 2️⃣ Dynamic → 3️⃣ Appendix\nDYNAMIC_REPO_INPUT=\"\
        ${{ github.event.inputs.DYNAMIC_REPO }}\"\ndeclare -A REPOS\nREPOS[\"OnePlusOSS\"]=\"OnePlusOSS|kernel_manifest\"\nREPOS[\"Dynamic\"]=\"\
        ${DYNAMIC_REPO_INPUT}|kernel_manifest\"\nREPOS[\"Appendix\"]=\"Numbersf|Kernel_Manifest_Appendix\"\n\nFOUND_REPO=\"\"\nFOUND_BRANCH=\"\
        \"\n\ncheck_repo() {\n  local ENTRY=$1\n  local OWNER=${ENTRY%%|*}\n  local REPO_NAME=${ENTRY##*|}\n\n  echo \"\U0001F310 尝试拉取 ${OWNER}/${REPO_NAME}\
        \ 分支列表...\"\n  BRANCHES=$(git ls-remote --heads https://github.com/${OWNER}/${REPO_NAME}.git | sed 's|.*refs/heads/||')\n\n  if [[ -z\
        \ \"$BRANCHES\" ]]; then\n    echo \"⚠️ ${OWNER}/${REPO_NAME} 分支列表获取失败，请尝试重新运行工作流。\"\n    return 1\n  fi\n  for BRANCH in $BRANCHES; do\n\
        \    XML_URL=\"https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/${FILE}.xml\"\n    README_URL=\"https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/README.md\"\
        \n\n    if curl -sf --head \"$XML_URL\" >/dev/null; then\n      echo \"✅ 在 ${OWNER}/${REPO_NAME} 找到 ${FILE}.xml (分支: ${BRANCH})\"\n  \
        \    curl -s -o \"$XML_PATH\" \"$XML_URL\"\n      curl -s -o \"$README_PATH\" \"$README_URL\" || true\n\n      FOUND_REPO=\"$OWNER\"\n\
        \      FOUND_REPO_NAME=\"$REPO_NAME\"\n      FOUND_BRANCH=\"$BRANCH\"\n\n      return 0\n    fi\n  done\n  return 1\n}\nif ! check_repo\
        \ \"${REPOS[\"OnePlusOSS\"]}\"; then\n  if ! check_repo \"${REPOS[\"Dynamic\"]}\"; then\n    check_repo \"${REPOS[\"Appendix\"]}\"\n \
        \ fi\nfi\nif [[ -z \"$FOUND_REPO\" || ! -s \"$XML_PATH\" ]]; then\n  echo \"❌ 无法在任何仓库中找到 ${FILE}.xml\"\n  exit 8\nfi\necho \"MANIFEST_REPO=$FOUND_REPO\"\
        \ >> \"$GITHUB_ENV\"\necho \"MANIFEST_REPO_NAME=$FOUND_REPO_NAME\" >> \"$GITHUB_ENV\"\necho \"MANIFEST_BRANCH=$FOUND_BRANCH\" >> \"$GITHUB_ENV\"\
        \n\n# 解析 revision 字符串\nREVISION=$(grep -oP '<project[^>]+revision=\"\\K[^\"]+' \"$XML_PATH\" | head -n1 || true)\necho \"解析 FILE 获取 CPU\
        \ 和 ANDROID_VERSION...\"\n# 提取 CPU\nCPU=$(echo \"$REVISION\" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\\2#')\n# 提取 ANDROID_VERSION\n\
        ANDROID_VERSION=$(echo \"$REVISION\" | grep -oP '\\d+\\.\\d+(\\.\\d+)?')\nif [[ -n \"$CPU\" && -n \"$ANDROID_VERSION\" ]]; then\n  echo\
        \ \"✅ CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION\"\n  echo \"CPU=$CPU\" >> $GITHUB_ENV\n  echo \"ANDROID_VERSION=$ANDROID_VERSION\" >>\
        \ $GITHUB_ENV\n  # 获取短位 Android 版本号\n  echo \"ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}\" >> $GITHUB_ENV\nelse\n  echo \"❌ 无法从 revision\
        \ 中提取 CPU 或 ANDROID_VERSION\"\n  exit 1\nfi\n\necho \"解析 README.md 获取 CPUD 和 BUILD_METHOD...\"\nif [[ -s \"$README_PATH\" ]]; then\n \
        \ BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' \"$README_PATH\" || true)\n  if [[ -n \"$BUILD_LINE\" ]]; then\n    CPUD=$(echo \"$BUILD_LINE\"\
        \ | awk '{print $(NF-1)}')\n    BUILD_METHOD=$(echo \"$BUILD_LINE\" | awk '{print $NF}')\n    echo \"✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD\"\
        \n    echo \"CPUD=$CPUD\" >> $GITHUB_ENV\n    echo \"BUILD_METHOD=$BUILD_METHOD\" >> $GITHUB_ENV\n  else\n    echo \"❌ README.md 中未找到构建命令\"\
        \n  fi\nelse\n  echo \"❌ README.md 下载失败或为空\"\nfi\n\n# 传递组合信息\necho \"value=${FILE_BASE}_Android${ANDROID_VERSION}\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - name: Debug Show Selected Inputs
      env:
        BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}
        SUFFIX: ${{ github.event.inputs.SUFFIX }}
      run: "echo \"------------------------------\"\n\necho \"Selected CPU: ${{ env.CPU }}\"\necho \"Selected CPUD: ${{ env.CPUD }}\"\necho \"\
        Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}\"\necho \"Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}\"\necho \"Selected FILE:\
        \ ${{ github.event.inputs.FILE }}\"\necho \"Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}\"\nif [ \"${{ github.event.inputs.SUSFS_CI\
        \ }}\" != \"N/A\" ]; then\n  echo \"::warning title=SUSFS Not Required::当前管理器已自带附加模块，无需启用 SUSFS 模块，强制启用可能导致不开机。\"\nfi\necho \"Selected\
        \ KPM: ${{ github.event.inputs.KPM }}\"\necho \"Custom SUSFS_META: ${{ github.event.inputs.SUSFS_META }}\"\necho \"Custom KSU_META: ${{\
        \ github.event.inputs.KSU_META }}\"\necho \"Selected ZRAM: ${{ github.event.inputs.ZRAM }}\"\necho \"Selected LSM_BBG: ${{ github.event.inputs.LSM_BBG\
        \ }}\"\necho \"Selected NETFILTER: ${{ github.event.inputs.NETFILTER }}\"\necho \"Selected CCM: ${{ github.event.inputs.CCM }}\"\necho\
        \ \"Selected SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}\"\necho \"Selected FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}\"\n\
        echo \"Selected SCHED_HMBIRD: ${{ github.event.inputs.SCHED_HMBIRD }}\"\necho \"Selected UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS\
        \ }}\"\necho \"Selected DROID_SPACES: ${{ github.event.inputs.DROID_SPACES }}\"\necho \"Selected RE_KERNEL: ${{ github.event.inputs.RE_KERNEL\
        \ }}\"\necho \"Selected LZ4_UPDATE: ${{ github.event.inputs.LZ4_UPDATE }}\"\necho \"Custom BUILD_TIME: $BUILD_TIME\"\necho -n \"BUILD_TIME\
        \ Unicode: \"\nCHECK_TEXT=\"$BUILD_TIME\" python3 \"$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py\"\
        \ --mode build_time\necho \"Custom SUFFIX: $SUFFIX\"\necho -n \"SUFFIX Unicode: \"\nCHECK_TEXT=\"$SUFFIX\" python3 \"$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_unicode_format.py\"\
        \ --mode suffix\n"
    - name: Check Disk Space
      run: df -h
    - name: Create and Enable 3G Swap
      run: 'sudo swapoff -a

        sudo fallocate -l 3G /swapfile

        sudo chmod 600 /swapfile

        sudo mkswap /swapfile

        sudo swapon /swapfile

        free -h

        '
    - name: Set Cache Environment
      if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
      run: 'echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV

        mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"

        echo "set: $HOME/.ccache_${{ github.event.inputs.FILE }}"

        '
    - name: Fork Check
      run: "repo=\"${{ github.repository }}\"; json=$(curl -s \"https://api.github.com/repos/$repo\")\nparent=$(echo \"$json\" | grep -o '\"full_name\"\
        : *\"[^\"]*\"' | head -n 2 | tail -n 1 | sed 's/.*\"full_name\": *\"\\([^\"]*\\)\".*/\\1/')\nif [ -n \"$parent\" ] && [ \"$parent\" !=\
        \ \"Numbersf/Action-Build\" ]; then\n  echo \"::warning title=Source Warning::您使用的内核编译地址为非官方源，可能导致运行失败或内核异常。\"\nfi\n"
    - name: Reject Check
      run: 'REJ_CHECKER="$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/check_rejects.sh"

        chmod +x "$REJ_CHECKER"

        echo "REJ_CHECKER=$REJ_CHECKER" >> $GITHUB_ENV

        '
    - name: Restore APT Cache
      id: apt-cache
      uses: actions/cache@v5
      with:
        path: ~/.apt-pkg-cache
        key: apt-cache-${{ runner.os }}-${{ github.ref_name }}-v6
    - name: Install Dependencies
      run: 'export APT_PACKAGES="python3 git curl libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils
        rsync unzip gawk dos2unix kmod libdw-dev elfutils dwarves"

        bash "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/cache_apt_pkgs.sh" ~/.apt-pkg-cache

        '
    - name: Setup Kotlin
      run: 'KOTLIN_VERSION="2.4.10"

        curl -sL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o kotlinc.zip

        unzip -q kotlinc.zip -d "$HOME"

        echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"

        '
    - name: Setup Ccache-ECS
      run: 'LIB_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/lib"

        sudo cp -f "$LIB_DIR/ccache" /usr/bin/ccache && sudo chmod +x /usr/bin/ccache

        '
    - name: Restore Ccache
      if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
      id: restore-ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD
          == 'true' && 'alpha' || 'beta' }}-17.0
    - name: Restore ThinLTO Cache
      if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' && github.event.inputs.FAST_BUILD == 'true' }}
      id: restore-thinlto
      uses: actions/cache/restore@v5
      with:
        path: ${{ github.workspace }}/kernel_workspace/.thinlto-cache
        key: thinlto-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-17.0
    - name: Initialize Ccache
      if: ${{ github.event.inputs.BUILD_NOCACHE == 'false' }}
      run: "INIT_FLAG=\"${{ env.CCACHE_DIR }}/.ccache_initialized\"\nif command -v ccache >/dev/null 2>&1; then\n  if [ ! -f \"$INIT_FLAG\" ];\
        \ then\n    echo \"初始化 ccache (${{ env.CCACHE_DIR }})...\"\n    mkdir -p \"${{ env.CCACHE_DIR }}\"\n    ccache -M ${{ env.CCACHE_MAXSIZE\
        \ }}\n    touch \"$INIT_FLAG\"\n    echo \"✅ ccache 初始化完成\"\n  else\n    echo \"✅ ccache 已初始化，跳过\"\n  fi\nelse\n  echo \"❌ 未安装 ccache，跳过\"\
        \nfi\nccache -s\n"
    - name: Install Repo Tool
      run: 'curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo

        chmod a+x ~/repo

        sudo mv ~/repo /usr/local/bin/repo

        '
    - name: Initialize Repo and Sync
      env:
        FILE: ${{ github.event.inputs.FILE }}
      run: "cd kernel_workspace\nmkdir -p .repo/manifests\ncp \"$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml\" \".repo/manifests/${FILE}.xml\"\
        \nBASE_URL=\"https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}.git\"\n\necho \"使用$MANIFEST_REPO/$MANIFEST_REPO_NAME($MANIFEST_BRANCH)初始化仓库...\"\
        \nrepo init -u \"$BASE_URL\" -b \"$MANIFEST_BRANCH\" -m \"${FILE}.xml\" --depth=1 --no-clone-bundle --no-tags\nsed -i -e '/prebuilts\\\
        /asuite\"/{/ks-kernel\\.lnx\\.5\\.0\\.r3-rel/d}' -e '/tools\\/tradefederation\\/prebuilts\"/{/ks-kernel\\.lnx\\.5\\.0\\.r3-rel/d}' \"\
        .repo/manifests/${FILE}.xml\"\npython3 - <<'PY'\nimport os\nimport xml.etree.ElementTree as ET\npath = '.repo/manifests/' + os.environ['FILE']\
        \ + '.xml'\ntree = ET.parse(path)\npins = {\n    'android_kernel_common_oneplus_sm8650': 'd86625c3830b59553b4db6b1b383fddd9655cabf',\n\
        \    'android_kernel_oneplus_sm8650': 'd46965e4116f27ccef043daea83223f2a94396fd',\n    'android_kernel_modules_and_devicetree_oneplus_sm8650':\
        \ 'c1ec0629b3f9bb245577e65f1ed70d5a371e4b9b',\n}\nfound = set()\nfor project in tree.getroot().iter('project'):\n    name = project.get('name')\n\
        \    if name in pins:\n        project.set('revision', pins[name])\n        found.add(name)\nassert found == set(pins), found\ntree.write(path,\
        \ encoding='utf-8', xml_declaration=True)\nPY\nrepo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync\ntest \"$(git -C kernel_platform/common\
        \ rev-parse HEAD)\" = \"d86625c3830b59553b4db6b1b383fddd9655cabf\"\ntest \"$(git -C kernel_platform/msm-kernel rev-parse HEAD)\" = \"\
        d46965e4116f27ccef043daea83223f2a94396fd\"\ntest \"$(git rev-parse HEAD)\" = \"c1ec0629b3f9bb245577e65f1ed70d5a371e4b9b\"\ngrep -q '^BRANCH=android14-6.1$'\
        \ kernel_platform/common/build.config.constants\ngrep -q '^SUBLEVEL = 141$' kernel_platform/common/Makefile\nrepo manifest -r -o \"$GITHUB_WORKSPACE/resolved-manifest.xml\"\
        \n\nKERNEL_REPOS=\"\"\nKERNEL_REPOS_PATH=$(find . -type f -name \"build.config.msm.common\" | head -n 1)\nif [[ -n \"$KERNEL_REPOS_PATH\"\
        \ ]]; then\n  KERNEL_REPOS=$(echo \"${KERNEL_REPOS_PATH#./}\" | cut -d/ -f2)\n  echo \"✅ 发现 build.config.msm.common: $KERNEL_REPOS_PATH\"\
        \n  echo \"✅ KERNEL_REPOS=$KERNEL_REPOS\"\n  echo \"KERNEL_REPOS=$KERNEL_REPOS\" >> \"$GITHUB_ENV\"\nelse\n  echo \"❎ 未找到 build.config.msm.common，可能是天玑清单或纯\
        \ Kleaf 构建结构\"\nfi\n\n# 移除 ABI 保护\nfor dir in kernel_platform/common kernel_platform/$KERNEL_REPOS; do\n  if [ -e \"$dir/BUILD.bazel\"\
        \ ]; then\n    sed -i '/^[[:space:]]*\"protected_exports_list\"[[:space:]]*:[[:space:]]*\"android\\/abi_gki_protected_exports_aarch64\"\
        ,$/d' \"$dir/BUILD.bazel\"\n  fi\n  rm -f \"$dir/android/abi_gki_protected_exports_\"* 2>/dev/null || echo \"No protected exports in $dir\"\
        \ndone\n\n# 移除构建审查\nif grep -q 'check_defconfig' kernel_platform/common/build.config.gki; then\n  sed -i 's/check_defconfig//' kernel_platform/common/build.config.gki\n\
        fi\nif grep -q 'check_defconfig = None,' kernel_platform/build/kernel/kleaf/common_kernels.bzl; then\n  sed -i 's/check_defconfig = None,/check_defconfig\
        \ = \"disabled\",/' kernel_platform/build/kernel/kleaf/common_kernels.bzl\n  sed -i 's/if check_defconfig == None:/if False:  # check_defconfig\
        \ == None:/' kernel_platform/build/kernel/kleaf/common_kernels.bzl\nfi\n"
    - name: Kernel Version Handling
      run: "cd kernel_workspace/kernel_platform\n# 获取内核 Android 版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION 2位)\nfor f in ./common/build.config.constants\
        \ ./common/build.config.common; do\n  if [ -f \"$f\" ]; then\n    KMI=$(grep -m1 '^BRANCH=' \"$f\" | cut -d= -f2)\n    [ -n \"$KMI\" ]\
        \ && break\n  fi\ndone\nif [[ -z \"$KMI\" && -n \"$KERNEL_REPOS\" ]]; then\n  KMI=$(grep -m1 '^android' \"./$KERNEL_REPOS/android/ACK_SHA\"\
        \ | cut -d- -f1,2)\nfi\nif [ -n \"$KMI\" ]; then\n  echo \"KMI=$KMI\" >> $GITHUB_ENV\n  echo \"KANDROID_VERSION=${KMI%-*}\" >> $GITHUB_ENV\n\
        \  echo \"KERNEL_VERSION=${KMI#*-}\" >> $GITHUB_ENV\nelse\n  echo \"No KMI found in build.config* and ACK_SHA files\"\nfi\n\n# 从 Makefile\
        \ 获取完整内核版本号 (CD) 并拆分\nVERSIONLEVEL=$(awk '/^VERSION =/ {print $3}' ./common/Makefile)\nPATCHLEVEL=$(awk '/^PATCHLEVEL =/ {print $3}' ./common/Makefile)\n\
        SUBLEVEL=$(awk '/^SUBLEVEL =/ {print $3}' ./common/Makefile)\necho \"VERSIONLEVEL=$VERSIONLEVEL\" >> $GITHUB_ENV\necho \"PATCHLEVEL=$PATCHLEVEL\"\
        \ >> $GITHUB_ENV\n# SUBLEVEL 仅传递修改前的值，因为伪装并不影响原源码状态\necho \"SUBLEVEL=$SUBLEVEL\" >> $GITHUB_ENV\nORIG_VERSION=$(awk '/^VERSION =/ {v=$3}\
        \ /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v\".\"p\".\"s}' ./common/Makefile)\n\n# 强制修改 SUBLEVEL (内核等级)\nRESUBLEVEL=\"${{\
        \ github.event.inputs.RESUBLEVEL }}\"\nif [ -n \"$RESUBLEVEL\" ]; then\n  echo \"修改 SUBLEVEL 为 $RESUBLEVEL\"\n  sed -i \"s/^SUBLEVEL[[:space:]]*=[[:space:]]*.*/SUBLEVEL\
        \ = $RESUBLEVEL/\" ./common/Makefile\nelse\n  echo \"未指定 SUBLEVEL，保持默认\"\nfi\n\n# 读取修改后的版本\nNEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL\
        \ =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v\".\"p\".\"s}' ./common/Makefile)\n# CKERNEL_VERSION(3位)：被修改之后或者未经过修改的完整内核版本号，用于欺骗系统\n# DKERNEL_VERSION(3位)：被修改之前的完整内核版本号，真实值\n\
        if [ \"$ORIG_VERSION\" != \"$NEW_VERSION\" ]; then\n  echo \"Kernel Version:$ORIG_VERSION->$NEW_VERSION\"\n  echo \"CKERNEL_VERSION=$NEW_VERSION\"\
        \ >> $GITHUB_ENV\n  echo \"DKERNEL_VERSION=$ORIG_VERSION\" >> $GITHUB_ENV\nelse\n  echo \"Kernel Version:$ORIG_VERSION No changes\"\n\
        \  echo \"CKERNEL_VERSION=$ORIG_VERSION\" >> $GITHUB_ENV\nfi\n\n# 内核版本的数字转换，仅前两位不包含 SUBLEVEL\necho \"KERNEL_SHORT_PATCH_VERSION=$(echo\
        \ $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')\" >> $GITHUB_ENV\n"
    - name: Rust Version Handling
      run: "cd kernel_workspace/kernel_platform\n# 从 build.config.constants 读取 RUSTC_VERSION\nRUSTC_VERSION=\"\"\nif [[ -f ./common/build.config.constants\
        \ ]]; then\n  RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)\nfi\nif [[ -n \"$RUSTC_VERSION\"\
        \ ]]; then\n  echo \"✅ RUSTC_VERSION(原始)=$RUSTC_VERSION\"\n  RUSTC_DIR_VERSION=$(echo \"$RUSTC_VERSION\" | grep -oE '^[0-9]+\\.[0-9]+\\\
        .[0-9]+')\n  if [[ -z \"$RUSTC_DIR_VERSION\" ]]; then\n    RUSTC_DIR_VERSION=\"$RUSTC_VERSION\"\n  fi\n  echo \"✅ RUSTC_DIR_VERSION(用于目录匹配)=$RUSTC_DIR_VERSION\"\
        \n  echo \"RUSTC_VERSION=$RUSTC_VERSION\" >> $GITHUB_ENV\n  echo \"RUSTC_DIR_VERSION=$RUSTC_DIR_VERSION\" >> $GITHUB_ENV\n  echo \"ENABLE_RUST=true\"\
        \ >> $GITHUB_ENV\nelse\n  echo \"✅ RUSTC_VERSION 未找到，Rust 编译已禁用\"\n  echo \"ENABLE_RUST=false\" >> $GITHUB_ENV\nfi\n"
    - name: Custom Kernel Suffix if set
      if: ${{ github.event.inputs.SUFFIX != '' && github.event.inputs.SUFFIX != '-1' }}
      run: "cd kernel_workspace/kernel_platform\nSUFFIX=\"${{ github.event.inputs.SUFFIX }}\"\nFAST_BUILD=\"${{ github.event.inputs.FAST_BUILD\
        \ }}\"\n\nfor f in ./common/scripts/setlocalversion ./\"$KERNEL_REPOS\"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion;\
        \ do\n  [ -f \"$f\" ] || continue\n  echo \"Modifying: $f\"\n\n  # Remove -dirty\n  sed -i 's/ -dirty//g' \"$f\"\n  sed -i '$i res=$(echo\
        \ \"$res\" | sed '\\''s/-dirty//g'\\'')' \"$f\"\n\n  if grep -q 'KERNELVERSION.*scm_version' \"$f\"; then\n    echo \"Detected NEW setlocalversion\
        \ format\"\n    sed -i \"s|echo \\\"\\${KERNELVERSION}.*scm_version}\\\"|echo \\\"\\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\\\"\
        |\" \"$f\"\n  elif grep -q 'echo \"\\$res\"' \"$f\"; then\n    echo \"Detected OLD setlocalversion format\"\n    if [ \"$FAST_BUILD\"\
        \ = \"true\" ]; then\n      echo \"FAST_BUILD enabled: using static res\"\n      sed -i \"s/^res=.*/res=\\\"-${KANDROID_VERSION}-${SUFFIX}\\\
        \"/\" \"$f\"\n    else\n      echo \"Standard build: injecting suffix via cut/echo\"\n      if [[ -f ./build_with_bazel.py ]]; then\n\
        \        echo \"使用官方脚本编译且当使用 build_with_bazel 时，可能受特殊符号数量限制，编译失败请修改\"\n        echo \"When using the official script and building with\
        \ build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the configuration if that happens.\"\
        \n      fi\n      tac \"$f\" | sed \"0,/echo \\\"\\\\\\$res\\\"/s//res=\\\\\\$(echo \\\\\\$res | cut -d- -f1-2)-${SUFFIX}; echo \\\"\\\
        \\\\$res\\\";/\" | tac > \"$f.tmp\" && mv \"$f.tmp\" \"$f\"\n    fi\n  else\n    echo \"Unknown format, appending echo manually\"\n  \
        \  echo \"echo \\\"\\$res-${SUFFIX}\\\"\" >> \"$f\"\n  fi\n  chmod +x \"$f\"\ndone\n"
    - name: Custom Kernel Random Suffix if empty
      if: ${{ github.event.inputs.SUFFIX == '' }}
      run: "cd kernel_workspace/kernel_platform\nFAST_BUILD=\"${{ github.event.inputs.FAST_BUILD }}\"\n\n# 生成随机数字和随机hash\nRANDOM_DIGIT=$(od -An\
        \ -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')\nRANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \\n')\nRANDOM_SUFFIX=\"\
        ${RANDOM_DIGIT}-o-g${RANDOM_HASH}\"\n\nfor f in ./common/scripts/setlocalversion ./\"$KERNEL_REPOS\"/scripts/setlocalversion ./external/dtc/scripts/setlocalversion;\
        \ do\n  [ -f \"$f\" ] || continue\n  echo \"Modifying: $f\"\n\n  # Remove -dirty\n  sed -i 's/ -dirty//g' \"$f\"\n  sed -i '$i res=$(echo\
        \ \"$res\" | sed '\\''s/-dirty//g'\\'')' \"$f\"\n\n  if grep -q 'KERNELVERSION.*scm_version' \"$f\"; then\n    echo \"Detected NEW setlocalversion\
        \ format\"\n    sed -i \"s|echo \\\"\\${KERNELVERSION}.*scm_version}\\\"|echo \\\"\\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\\\
        \"|\" \"$f\"\n  elif grep -q 'echo \"\\$res\"' \"$f\"; then\n    echo \"Detected OLD setlocalversion format\"\n    if [ \"$FAST_BUILD\"\
        \ = \"true\" ]; then\n      echo \"FAST_BUILD enabled: using static res with random suffix\"\n      sed -i \"s/^res=.*/res=\\\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\\\
        \"/\" \"$f\"\n    else\n      echo \"Standard build: injecting random suffix via cut/echo\"\n      tac \"$f\" | sed \"0,/echo \\\"\\\\\
        \\$res\\\"/s//res=\\\\\\$(echo \\\\\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \\\"\\\\\\$res\\\";/\" | tac > \"$f.tmp\" && mv \"$f.tmp\"\
        \ \"$f\"\n    fi\n  else\n    echo \"Unknown format, appending echo manually\"\n    echo \"echo \\\"\\$res-${RANDOM_SUFFIX}\\\"\" >> \"\
        $f\"\n  fi\n  chmod +x \"$f\"\ndone\n"
    - name: Add SukiSU Ultra
      run: "cd kernel_workspace/kernel_platform\nKSU_META=\"${{ github.event.inputs.KSU_META }}\"\n\n# 必须包含两个分隔符（至少四个字段）\nif [[ \"$(grep -o '/'\
        \ <<< \"$KSU_META\" | wc -l)\" -lt 3 ]]; then\n  echo \"错误: KSU_META 参数缺少必要的分隔符 '/'，格式应为: 管理器分支名/内置分支名/自定义标识(可省略)/提交hash(可省略)\"\n  exit\
        \ 10\nfi\n\n# 解析字段：分支 / 自定义标识 / 手动 hash\nIFS='/' read -r KSU_MANAGER_BRANCH KSU_BUILTIN_BRANCH KSU_CUSTOM_TAG MANUAL_HASH <<< \"$KSU_META\"\
        \necho \"KSU_MANAGER_BRANCH=$KSU_MANAGER_BRANCH\" >> $GITHUB_ENV\necho \"KSU_BUILTIN_BRANCH=$KSU_BUILTIN_BRANCH\" >> $GITHUB_ENV\n[[ -n\
        \ \"$KSU_CUSTOM_TAG\" ]] && echo \"自定义版本标识: $KSU_CUSTOM_TAG\" || echo \"自定义版本标识: 未启用\"\n[[ -n \"$MANUAL_HASH\" ]] && echo \"手动指定 hash:\
        \ $MANUAL_HASH\" || echo \"手动指定 hash: 未启用\"\n\ncurl -LSs \"https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${KSU_MANAGER_BRANCH}/kernel/setup.sh\"\
        \ | bash -s \"$KSU_BUILTIN_BRANCH\"\ncd ./KernelSU\n\n# 如果指定了手动 hash，就切换到该提交\nif [[ -n \"$MANUAL_HASH\" ]]; then\n  git fetch origin \"\
        $KSU_BUILTIN_BRANCH\" --depth=50\n  git checkout \"$MANUAL_HASH\"\n  test \"$(git rev-parse HEAD)\" = \"$MANUAL_HASH\"\n  SHORT_HASH=${MANUAL_HASH:0:8}\n\
        fi\n\n\nKSU_VERSION_TAG=$(curl -fsSL https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest \\\n  | grep '\"tag_name\"\
        :' | sed -E 's/.*\"v?([^\"]+)\".*/\\1/')\nif [[ -z \"$KSU_VERSION_TAG\" || \"$(printf '%s\\n' \"$KSU_VERSION_TAG\" \"3.1.7\" | sort -V\
        \ | head -n1)\" != \"3.1.7\" ]]; then\n  KSU_VERSION_TAG=\"3.1.7\"\nfi\necho \"KSU_VERSION_TAG=$KSU_VERSION_TAG\" >> $GITHUB_ENV\n\nGIT_HASH=$(git\
        \ rev-parse --short HEAD)\necho \"GIT_HASH=$GIT_HASH\"\n\n# 组装版本号\nif [[ -n \"$MANUAL_HASH\" ]]; then\n  USE_HASH=\"$SHORT_HASH\"\nelse\n\
        \  USE_HASH=\"$GIT_HASH\"\nfi\nif [[ -z \"$KSU_CUSTOM_TAG\" ]]; then\n  VERSION_FULL=\"v$KSU_VERSION_TAG-$USE_HASH@$KSU_BUILTIN_BRANCH\"\
        \nelse\n  VERSION_FULL=\"v$KSU_VERSION_TAG-$KSU_CUSTOM_TAG@$KSU_BUILTIN_BRANCH[$USE_HASH]\"\nfi\n\nESC_VERSION_FULL=$(printf '%s' \"$VERSION_FULL\"\
        \ | sed 's/[&|\\\\/]/\\\\&/g')\nESC_KSU_VERSION_TAG=$(printf '%s' \"$KSU_VERSION_TAG\" | sed 's/[&|\\\\/]/\\\\&/g')\n\nif grep -q '^KSU_VERSION_FULL\
        \ := ' kernel/Makefile; then\n  sed -i \"s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := $ESC_VERSION_FULL|\" kernel/Makefile\nelse\n  awk\
        \ -v full=\"$VERSION_FULL\" '\n    /^REPO_OWNER :=/ && !done {\n      print\n      print \"\"\n      print \"KSU_VERSION_FULL := \" full\n\
        \      done=1\n      next\n    }\n    { print }\n  ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile\n\
        fi\n\nif grep -q '^KSU_VERSION_API := ' kernel/Makefile; then\n  sed -i \"s|^KSU_VERSION_API := .*|KSU_VERSION_API := $ESC_KSU_VERSION_TAG|\"\
        \ kernel/Makefile\nfi\n\nKSU_VERSION=$(expr $(git rev-list --count \"$KSU_MANAGER_BRANCH\" 2>/dev/null || echo 13000) + 37185)\necho \"\
        KSUVER=$KSU_VERSION\" >> $GITHUB_ENV\n\necho \"::group::最终 Makefile 中版本信息及部分调试结果预览\"\ngrep -nE '^(REPO_OWNER|REPO_NAME|REPO_BRANCH|KSU_VERSION_API|KSU_VERSION_FULL|VERSION_TAG|GIT_BIN|CURL_BIN)'\
        \ kernel/Makefile\necho \"::endgroup::\"\n"
    - name: Apply Fake Patches
      if: ${{ github.event.inputs.SUSFS_META != '-1' }}
      run: 'kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" apply "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

        '
    - name: Apply Patches SukiSU Ultra
      env:
        FILE: ${{ github.event.inputs.FILE }}
      run: "cd kernel_workspace\nif [ \"${{ github.event.inputs.SUSFS_META }}\" != \"-1\" ]; then\n  SUSFS_META=\"${{ github.event.inputs.SUSFS_META\
        \ }}\"\n  git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}${{ github.event.inputs.SUSFS_DEV\
        \ == 'true' && '-dev' || '' }}\n  cd susfs4ksu\n  if [ -n \"$SUSFS_META\" ]; then\n    if [[ \"$SUSFS_META\" =~ ^[0-9]+$ ]]; then\n  \
        \    git checkout HEAD~$SUSFS_META\n    else\n      git checkout \"$SUSFS_META\"\n    fi\n  else\n    echo \"SUSFS_META 为空，使用最新上游 SUSFS\"\
        \n  fi\n  cd ..\nfi\nif [ \"${{ github.event.inputs.RE_KERNEL }}\" = \"true\" ]; then\n  git clone https://github.com/Sakion-Team/Re-Kernel.git\n\
        fi\nif [ \"${{ github.event.inputs.LZ4_UPDATE }}\" = \"true\" ]; then\n  git clone https://github.com/Numbersf/lz4_oplus.git\nfi\ngit\
        \ clone https://github.com/ShirkNeko/SukiSU_patch.git\ncd kernel_platform\nif [ \"${{ github.event.inputs.SUSFS_META }}\" != \"-1\" ];\
        \ then\n  echo \"正在拉取susfs补丁\"\n  cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION\
        \ }}.patch ./common/\n  cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/\n  cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/\n\
        fi\n\nif [[ \"${{ github.event.inputs.ZRAM }}\" == 1* ]]; then\n  echo \"正在拉取zram补丁\"\n  cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/*\
        \ ./common/include/linux/\n  cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/\n  cp -r ../SukiSU_patch/other/zram/lz4k/crypto/*\
        \ ./common/crypto/\n  cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/\nfi\n\ncd ./common\n\nif [ \"$KMI\" == \"android13-5.15\"\
        \ ] && [ \"$SUBLEVEL\" -lt 123 ]; then\n  echo \"修复内核版本为5.15.0~5.15.123仅支持旧版C库造成的一些bug\"\n  cp \"${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches/fix_5.15.legacy\"\
        \ ./fix_5.15.legacy.patch\n  patch -p1 < fix_5.15.legacy.patch\n  echo \"fix_5.15_patch完成\"\nfi\n\nif [ \"${{ github.event.inputs.SUSFS_META\
        \ }}\" != \"-1\" ]; then\n  echo \"正在打susfs补丁\"\n  patch -p1 < 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION\
        \ }}.patch || true\n  echo \"susfs_patch完成\"\nfi\nsource $REJ_CHECKER\ncheck_rejects .\n"
    - name: Revert and Postfix Fake Patches
      if: ${{ github.event.inputs.SUSFS_META != '-1' }}
      run: 'kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" postfix "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

        kotlin "$GITHUB_WORKSPACE/kernel_workspace/Action-Build/scripts/PatchFakePatches.kts" revert "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

        '
    - name: Apply BBRv3
      if: ${{ github.event.inputs.CCM == 'true' && env.KMI != 'android16-6.12' }}
      run: "PATCH_DIR=\"${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches\"\ncd kernel_workspace/kernel_platform/common\npatch -p1 < \"\
        ${PATCH_DIR}/bbrv3/0001-net-tcp-backport-BBRv3-to-$KMI.patch\"\nif [ \"$KMI\" = \"android12-5.10\" ]; then\n  if ! grep -qF 'int proc_dou8vec_minmax('\
        \ ./include/linux/sysctl.h; then\n    patch -p1 < \"${PATCH_DIR}/bbrv3/sysctl_add_proc_dou8vec_minmax.patch\"\n    patch -p1 < \"${PATCH_DIR}/bbrv3/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch\"\
        \n  fi\nfi\nsource $REJ_CHECKER\ncheck_rejects .\n"
    - name: Apply UNICODE_BYPASS
      if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
      run: "PATCH_DIR=\"${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches\"\ncd kernel_workspace/kernel_platform/common\nif [ \"$VERSIONLEVEL\"\
        \ -lt 6 ]; then\n  patch -p1 --forward < \"${PATCH_DIR}/unicode_bypass_fix_6.1-.patch\" || true\nelse\n  patch -p1 --forward < \"${PATCH_DIR}/unicode_bypass_fix_6.1+.patch\"\
        \ || true\nfi\nsource $REJ_CHECKER\ncheck_rejects .\n"
    - name: Apply RE_KERNEL
      if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
      run: "RE_DIR=\"${GITHUB_WORKSPACE}/kernel_workspace/Re-Kernel/LKM-Source\"\ncd kernel_workspace/kernel_platform/common\nsed -i '/endmenu/i\
        \ source \"drivers/rekernel/Kconfig\"' drivers/Kconfig\nsed -i '$a \\#Re-Kernel Support\\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile\n\
        mkdir -p drivers/rekernel\ncp -r \"${RE_DIR}\"/* drivers/rekernel/\nif [ -f BUILD.bazel ]; then\n  sed -i '0,/name = \"kernel_aarch64\"\
        ,/{/module_implicit_outs/s|,$| + [\"drivers/rekernel/rekernel.ko\"],|}' BUILD.bazel\nfi\n"
    - name: Apply DROID_SPACES
      env:
        FILE: ${{ github.event.inputs.FILE }}
      if: ${{ github.event.inputs.DROID_SPACES == 'true' }}
      run: "PATCH_DIR=\"${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches\"\ncd kernel_workspace/kernel_platform/common\n# 注释掉原始的 sysv\
        \ 结构体定义\nsed -i 's/^\\(\\t\\)struct sysv_sem\\b.*sysvsem;/\\1\\/\\/ struct sysv_sem\\t\\t\\tsysvsem;/' include/linux/sched.h\nsed -i 's/^\\\
        (\\t\\)struct sysv_shm\\b.*sysvshm;/\\1\\/\\/ struct sysv_shm\\t\\t\\tsysvshm;/' include/linux/sched.h\n\nif [ \"$KMI\" = \"android12-5.10\"\
        \ ]; then\n  echo \"为 android12-5.10 修复 sysvipc KABI 绕过及 POSIX_MQUEUE ABI 填充问题...\"\n  sed -i '/^\\tconst struct sched_class\\t\\*sched_class;/a\
        \ \\\\n#ifndef __GENKSYMS__\\n\\tstruct sysv_sem\\t\\t\\tsysvsem;\\n\\tstruct sysv_shm\\t\\t\\tsysvshm;\\n#endif\\n' include/linux/sched.h\n\
        \  sed -i 's/^\\tunsigned long mq_bytes;\\t\\/\\* How many bytes can be allocated to mqueue[?] \\*\\//\\t\\/\\/unsigned long mq_bytes;\\\
        t\\/* How many bytes can be allocated to mqueue? *\\//' include/linux/sched/user.h\n  sed -i '/struct ratelimit_state ratelimit;/,/ANDROID_OEM_DATA_ARRAY(1,\
        \ 2);/{/^\\tANDROID_KABI_RESERVE(1);/{N;N;s/^\\tANDROID_KABI_RESERVE(1);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_OEM_DATA_ARRAY(1,\
        \ 2);/#if defined(CONFIG_POSIX_MQUEUE)\\n\\tANDROID_KABI_USE(1, unsigned long mq_bytes);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_OEM_DATA_ARRAY(1,\
        \ 2);\\n#else\\n\\tANDROID_KABI_RESERVE(1);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_OEM_DATA_ARRAY(1, 2);\\n#endif/}}' include/linux/sched/user.h\n\
        # 检查 sched.h 并修改 KABI 槽位或指针\nelif grep -q \"sched_dl_entity.*\\*dl_server\" include/linux/sched.h; then\n  echo \"✅ 检测到 dl_server 指针，使用\
        \ packed union 方案\"\n  sed -i 's|\\tstruct sched_entity\\t\\tse;|#ifdef CONFIG_SYSVIPC\\n\\tunion {\\n\\t\\tchar __kabi_ignored_0;\\n\\\
        t\\tstruct sysv_sem\\t\\t\\tsysvsem;\\n\\t}__attribute__((packed));\\n\\tunion {\\n\\t\\tchar __kabi_ignored_1;\\n\\t\\tstruct sysv_shm\\\
        t\\t\\tsysvshm;\\n\\t}__attribute__((packed));\\n#endif\\n\\n\\tstruct sched_entity\\t\\tse;|' include/linux/sched.h\nelif grep -q \"\
        ANDROID_KABI_USE(1,\" include/linux/sched.h; then\n  echo \"✅ 检测到 USE(1)，使用槽位 6,7,8\"\n  sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|\\\
        tANDROID_KABI_RESERVE(6);\\n\\tANDROID_KABI_RESERVE(7);\\n\\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\\n\\tANDROID_KABI_USE(6, struct\
        \ sysv_sem sysvsem);\\n\\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\\n#else\\\
        n\\tANDROID_KABI_RESERVE(6);\\n\\tANDROID_KABI_RESERVE(7);\\n\\tANDROID_KABI_RESERVE(8);\\n#endif|;}' include/linux/sched.h\nelif grep\
        \ -q \"ANDROID_KABI_RESERVE(1);\" include/linux/sched.h; then\n  echo \"✅ 检测到 RESERVE(1)，使用槽位 1,2,3\"\n  sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;N;N;N;N;N;s|\\\
        tANDROID_KABI_RESERVE(1);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_KABI_RESERVE(3);\\n\\tANDROID_KABI_RESERVE(4);\\n\\tANDROID_KABI_RESERVE(5);\\\
        n\\tANDROID_KABI_RESERVE(6);\\n\\tANDROID_KABI_RESERVE(7);\\n\\tANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\\n\\tANDROID_KABI_USE(1,\
        \ struct sysv_sem sysvsem);\\n\\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\\n#else\\\
        n\\tANDROID_KABI_RESERVE(1);\\n\\tANDROID_KABI_RESERVE(2);\\n\\tANDROID_KABI_RESERVE(3);\\n#endif\\n\\tANDROID_KABI_RESERVE(4);\\n\\tANDROID_KABI_RESERVE(5);\\\
        n\\tANDROID_KABI_RESERVE(6);\\n\\tANDROID_KABI_RESERVE(7);\\n\\tANDROID_KABI_RESERVE(8);|;}' include/linux/sched.h\nelif grep -q \"ANDROID_KABI_RESERVE(3);\"\
        \ include/linux/sched.h; then\n  echo \"✅ fallback，使用槽位 3,4,5\"\n  sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;N;s|\\tANDROID_KABI_RESERVE(3);\\\
        n\\tANDROID_KABI_RESERVE(4);\\n\\tANDROID_KABI_RESERVE(5);\\n\\tANDROID_KABI_RESERVE(6);|#ifdef CONFIG_SYSVIPC\\n\\tANDROID_KABI_USE(3,\
        \ struct sysv_sem sysvsem);\\n\\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\\n#else\\\
        n\\tANDROID_KABI_RESERVE(3);\\n\\tANDROID_KABI_RESERVE(4);\\n\\tANDROID_KABI_RESERVE(5);\\n#endif\\n\\tANDROID_KABI_RESERVE(6);|;}' include/linux/sched.h\n\
        else\n  echo \"❌ 无法通过上下文精准匹配 KABI 槽位或对应指针\"\n  exit 9\nfi\n\necho \"为 oplus_bsp_midas 模块返回幽灵任务以避免空指针崩溃...\"\npatch -p1 --forward < \"\
        ${PATCH_DIR}/ghost-task-for-midas.patch\" || true\n\nif [ \"$KMI\" = \"android16-6.12\" ]; then\n  rm -f include/uapi/linux/ntsync.h\n\
        \  rm -f drivers/misc/ntsync.c\n  echo \"补全 IPC NS 符号导出...\"\n  if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' ./ipc/namespace.c; then\n   \
        \ echo -e '\\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> ./ipc/namespace.c\n  fi\n  if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' ./ipc/msgutil.c;\
        \ then\n    echo -e '\\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> ./ipc/msgutil.c\n  fi\nfi\necho \"拓展 ntsync 支持...\"\npatch -p1 --forward <\
        \ \"${PATCH_DIR}/ntsync/ntsync_base.patch\" || true\nif [[ \"$FILE\" == oneplus_10r* ]]; then\n  patch -p1 --forward < \"${PATCH_DIR}/ntsync/ntsync_compat_android12-5.10_14.patch\"\
        \ || true\nelse\n  patch -p1 --forward < \"${PATCH_DIR}/ntsync/ntsync_compat_$([ -f \"${PATCH_DIR}/ntsync/ntsync_compat_${KMI}_${ANDROID_SHORT_VERSION}.patch\"\
        \ ] && echo \"${KMI}_${ANDROID_SHORT_VERSION}\" || echo \"${KMI}\").patch\" || true\nfi\nsource $REJ_CHECKER\ncheck_rejects .\n"
    - name: Apply LZ4_DEV
      if: ${{ github.event.inputs.LZ4_UPDATE == 'true' }}
      run: 'set -euo pipefail

        LZ4_REPO="${GITHUB_WORKSPACE}/kernel_workspace/lz4_oplus"

        cd kernel_workspace/kernel_platform/common

        . "${LZ4_REPO}/apply_lz4_oplus.sh"

        '
    - name: Apply ZRAM
      if: startsWith(github.event.inputs.ZRAM, '1/')
      run: "ZRAM=\"${{ github.event.inputs.ZRAM }}\"\nif [[ \"$(grep -o '/' <<< \"$ZRAM\" | wc -l)\" -lt 2 ]]; then\n  echo \"错误: ZRAM 参数缺少必要的分隔符\
        \ '/'，格式应为: 总开关0关1开/算法名(前面输入0时无效)/大小(前面输入0时无效)\"\n  exit 10\nfi\n# 解析字段：开关状态 / 算法名 / 大小\nIFS='/' read -r ZRAM_SWSTA ZRAM_ALGO ZRAM_SIZE\
        \ <<< \"$ZRAM\"\necho \"ZRAM_ALGO=$ZRAM_ALGO\" >> $GITHUB_ENV\necho \"ZRAM_ALGO_U=${ZRAM_ALGO^^}\" >> $GITHUB_ENV\necho \"ZRAM_SIZE=$ZRAM_SIZE\"\
