        \ \"CONFIG_IP_SET_HASH_IPPORTNET=y\"\n  set_config \"CONFIG_IP_SET_HASH_IPMAC=y\"\n  set_config \"CONFIG_IP_SET_HASH_MAC=y\"\n  set_config\
        \ \"CONFIG_IP_SET_HASH_NETPORTNET=y\"\n  set_config \"CONFIG_IP_SET_HASH_NET=y\"\n  set_config \"CONFIG_IP_SET_HASH_NETNET=y\"\n  set_config\
        \ \"CONFIG_IP_SET_HASH_NETPORT=y\"\n  set_config \"CONFIG_IP_SET_HASH_NETIFACE=y\"\n  set_config \"CONFIG_IP_SET_LIST_SET=y\"\n  set_hide_config\
        \ \"CONFIG_IP6_NF_NAT=y\"\n  set_config \"CONFIG_IP6_NF_TARGET_MASQUERADE=y\"\n  set_config \"CONFIG_NETFILTER_XT_TARGET_HL=y\"\n  set_config\
        \ \"CONFIG_IP_NF_TARGET_TTL=y\"\n  set_config \"CONFIG_IP6_NF_TARGET_HL=y\"\n  set_config \"CONFIG_NETFILTER_XT_MATCH_HL=y\"\n  set_config\
        \ \"CONFIG_IP_NF_MATCH_TTL=y\"\n  set_config \"CONFIG_IP6_NF_MATCH_HL=y\"\n  set_config \"CONFIG_IP_NF_MANGLE=y\"\n  set_config \"CONFIG_IP6_NF_MANGLE=y\"\
        \nfi\n\n# 构建依赖项调整及优化\nif [ \"$KERNEL_VERSION\" = \"5.15\" ] && [[ \"$CPU\" == mt* ]]; then\n  set_config \"CONFIG_OPLUS_SYSTEM_KERNEL=y\"\
        \n  set_config \"CONFIG_OPLUS_FEATURE_CMDLINE=m\"\n  set_config \"CONFIG_OPLUS_FEATURE_OPLUSBOOT=m\"\n  set_config \"CONFIG_OPLUS_FEATURE_BUILDVARIANT=m\"\
        \n  set_config \"CONFIG_OPLUS_FEATURE_OPROJECT=m\"\nfi\nif [[ \"$ENABLE_RUST\" == \"true\" ]]; then\n  set_config \"CONFIG_RUST=y\"\n\
        \  set_config \"CONFIG_ANDROID_BINDER_IPC_RUST=m\"\nfi\n"
    - name: Custom BUILD_TIME
      if: ${{ github.event.inputs.BUILD_TIME != '-1' }}
      shell: bash
      run: "INPUT_TIME=\"${{ github.event.inputs.BUILD_TIME }}\"\nif [[ -n \"$INPUT_TIME\" && \"$INPUT_TIME\" != \"F\" ]]; then\n  DATESTR=\"\
        $INPUT_TIME\"\n  echo \"Using input BUILD_TIME: $DATESTR\"\nelse\n  DATESTR=\"$(TZ='UTC' date +'%a %b %d %T %Z %Y')\"\n  echo \"Using\
        \ UTC time as fallback: $DATESTR\"\nfi\necho \"KBUILD_BUILD_TIMESTAMP=${DATESTR}\" >> \"$GITHUB_ENV\"\necho \"KBUILD_BUILD_VERSION=1\"\
        \ >> \"$GITHUB_ENV\"\ncd kernel_workspace/kernel_platform/\nfor f in ./common/scripts/mkcompile_h ./\"$KERNEL_REPOS\"/scripts/mkcompile_h;\
        \ do\n  if [ -f \"$f\" ]; then\n    echo \"Patching mkcompile_h with BUILD_TIME=$DATESTR\"\n    if grep -q 'UTS_VERSION=' \"$f\"; then\n\
        \      perl -pi -e \"s{UTS_VERSION=\\\"\\\\\\$\\\\(.*?\\\\)\\\"}{UTS_VERSION=\\\"#1 SMP PREEMPT $DATESTR\\\"}\" \"$f\"\n    else\n   \
        \   perl -0777 -pi -e \"s{cat <<EOF}{cat <<EOF\\n#undef UTS_VERSION\\n#define UTS_VERSION \\\"#1 SMP PREEMPT $DATESTR\\\" } unless /UTS_VERSION/\"\
        \ \"$f\"\n    fi\n  fi\ndone\n"
