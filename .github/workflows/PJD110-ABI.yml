        \ -a HIDE_CONFIGS=()\n\nset_config() {\n  local val=\"$1\"\n  local key=\"${val%%=*}\"\n  if grep -qF \"${key}=\" \"$CONFIG_FILE\" ||\
        \ grep -qF \"# ${key} is not set\" \"$CONFIG_FILE\"; then\n    VAL=\"$val\" awk -v key=\"$key\" '\n      $0 == \"# \" key \" is not set\"\
        \ || index($0, key \"=\") == 1 { print ENVIRON[\"VAL\"]; next }\n      { print }\n    ' \"$CONFIG_FILE\" > \"${CONFIG_FILE}.tmp\" && mv\
        \ \"${CONFIG_FILE}.tmp\" \"$CONFIG_FILE\" || rm -f \"${CONFIG_FILE}.tmp\"\n  else\n    printf '%s\\n' \"$val\" >> \"$CONFIG_FILE\"\n \
        \ fi\n}\n\nset_hide_config() {\n  local val=\"$1\"\n  local key=\"${val%%=*}\"\n  set_config \"$val\"\n  HIDE_CONFIGS+=(\"$key\")\n}\n\
        \ninject_fake_config() {\n  [ \"${#HIDE_CONFIGS[@]}\" -eq 0 ] && return 0\n  local marker=\"# --- fake_config injector ---\"\n  if ! grep\
        \ -qF \"$marker\" \"$MAKEFILE\"; then\n    {\n      printf '\\n%s\\n' \"$marker\"\n      printf 'ifneq ($(strip $(CONFIG_FAKE_DISABLE)),)\\\
        n'\n      printf '$(obj)/config_data: $(KCONFIG_CONFIG) FORCE\\n'\n      printf '\\t$(Q)sed $(foreach opt,$(CONFIG_FAKE_DISABLE),-e '\"\
        '\"'s|^$(opt)=.*|# $(opt) is not set|'\"'\"') $(KCONFIG_CONFIG) > $@\\n'\n      printf 'endif\\n'\n    } >> \"$MAKEFILE\"\n  fi\n  echo\
        \ \"CONFIG_FAKE_DISABLE=${HIDE_CONFIGS[*]}\" >> \"$GITHUB_ENV\"\n}\ntrap 'inject_fake_config' EXIT\n\n# SukiSU Ultra配置\nset_config \"\
        CONFIG_KSU=y\"\n\n# KPM配置\nif [ \"${{ github.event.inputs.KPM }}\" = \"KPM\" ]; then\n  set_config \"CONFIG_KPM=y\"\nelse\n  set_config\
        \ \"CONFIG_KPM=n\"\nfi\n\n# SUSFS配置\nif [ \"${{ github.event.inputs.SUSFS_META }}\" != \"-1\" ]; then\n  set_config \"CONFIG_KSU_SUSFS=y\"\
